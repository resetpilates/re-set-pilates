# One-off, run by hand: re-encode the home first-screen videos with ffmpeg (not installed on the studio Mac) and commit them.
# Drop the new footage in public/media as hero-orit-wide.mp4 (laptops) and hero-orit-tall.mp4 (phones), then run this:
# it writes a 1600px-wide file and a 720px-wide file over them, silent, ready for the web.
name: compress-hero
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
      - name: Encode
        run: |
          set -e
          cd public/media
          ffmpeg -v error -i hero-orit-wide.mp4 -an -c:v libx264 -preset slow -crf 25 -maxrate 3000k -bufsize 6000k \
            -vf "scale=1600:-2" -pix_fmt yuv420p -movflags +faststart -y wide.tmp.mp4
          ffmpeg -v error -i hero-orit-tall.mp4 -an -c:v libx264 -preset slow -crf 25 -maxrate 1600k -bufsize 3200k \
            -vf "scale=720:-2" -pix_fmt yuv420p -movflags +faststart -y tall.tmp.mp4
          mv wide.tmp.mp4 hero-orit-wide.mp4
          mv tall.tmp.mp4 hero-orit-tall.mp4
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media
          git commit -m "Compress the home first-screen videos (wide + tall)" || echo "nothing to commit"
          git push
